name: fitness-wger
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-wger: &wger
  # Built locally by prepare-react.sh --backend-image; release_web.py refuses unless the tag
  # resolves to the image ID, revision and APP_BUILD_COMMIT in overrides/backend-image.json.next.
  image: fitness-wger-backend:0812ca39a80e82c071c99a54300df73e28668776
  env_file: [./config/private.env]
  restart: unless-stopped
  logging: *logging
services:
  web:
    <<: *wger
    mem_limit: 1024m
    cpus: 1.0
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
      - ./overrides/react-main.js:/home/wger/src/node_modules/@wger-project/react-components/build/main.js:ro
      - ./overrides/history-overview.html:/home/wger/src/wger/exercises/templates/history/overview.html:ro
      - ./overrides/api-key.html:/home/wger/src/wger/core/templates/user/api_key.html:ro
      - ./overrides/pdf.py:/home/wger/src/wger/utils/pdf.py:ro
      - ./overrides/settings-main.py:/home/wger/src/settings/main.py:ro
      - ./overrides/manager-urls.py:/home/wger/src/wger/manager/urls.py:ro
      - ./formats/en_AU/formats.py:/home/wger/src/wger/formats/en_AU/formats.py:ro
      - &recovery-model ./overrides/manager-session-recovery.py:/home/wger/src/wger/manager/models/session_recovery.py:ro
      - &recovery-exports ./overrides/manager-models-init.py:/home/wger/src/wger/manager/models/__init__.py:ro
      - &recovery-api ./overrides/manager-api-views.py:/home/wger/src/wger/manager/api/views.py:ro
      - &recovery-tasks ./overrides/manager-tasks.py:/home/wger/src/wger/manager/tasks.py:ro
      - &recovery-log ./overrides/manager-log.py:/home/wger/src/wger/manager/models/log.py:ro
      - &recovery-cardio-migration ./overrides/manager-0030-workoutlog-cardio-metrics.py:/home/wger/src/wger/manager/migrations/0030_workoutlog_cardio_metrics.py:ro
      - &recovery-migration ./overrides/manager-0031-session-recovery.py:/home/wger/src/wger/manager/migrations/0031_workoutsessionrecovery.py:ro
    expose: ['8000']
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, -O, /dev/null, 'http://localhost:8000/api/v2/version/']
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
  db:
    image: docker.io/postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    env_file: [./config/private.env]
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    cpus: 0.5
    shm_size: 256mb
    volumes: [database:/var/lib/postgresql/data]
    command: [postgres, -c, wal_level=logical, -c, shared_buffers=128MB, -c, effective_cache_size=512MB, -c, work_mem=4MB, -c, max_connections=30]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h localhost -U "$$POSTGRES_USER"']
      interval: 15s
      timeout: 5s
      retries: 8
  cache:
    image: docker.io/redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    cpus: 0.25
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 15s, timeout: 5s, retries: 5}
  powersync:
    image: docker.io/journeyapps/powersync-service@sha256:39f6a534f757afd1c633e91a19b23fde03186d16b5543b4af0f5c8f09d4cb79d
    env_file: [./config/private.env]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      db: {condition: service_healthy}
      web: {condition: service_healthy}
    command: [start, -r, unified]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_JWKS_URL: http://web:8000/api/v2/powersync-keys
    volumes: [./config/powersync.yaml:/config/powersync.yaml:ro, ./config/sync_rules.yaml:/config/sync_rules.yaml:ro]
    expose: ['8080']
  nginx:
    image: docker.io/nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    cpus: 0.25
    depends_on: [web, powersync]
    volumes: [./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro, static:/wger/static:ro, media:/wger/media:ro]
    ports: ['127.0.0.1:8097:80']
  celery_worker:
    <<: *wger
    mem_limit: 512m
    cpus: 0.5
    command: /start-worker
    depends_on:
      web: {condition: service_healthy}
    volumes:
      - media:/home/wger/media
      - ./overrides/settings-main.py:/home/wger/src/settings/main.py:ro
      - ./formats/en_AU/formats.py:/home/wger/src/wger/formats/en_AU/formats.py:ro
      - *recovery-model
      - *recovery-exports
      - *recovery-api
      - *recovery-tasks
      - *recovery-log
      - *recovery-cardio-migration
      - *recovery-migration
  celery_beat:
    <<: *wger
    # Beat loads the full Django app to prove tasks and schedule at release, which
    # peaks above 192m and was killed with 137 mid-release.
    mem_limit: 384m
    cpus: 0.25
    command: /start-beat
    depends_on: [celery_worker]
    volumes:
      - beat:/home/wger/beat
      - ./overrides/settings-main.py:/home/wger/src/settings/main.py:ro
      - ./formats/en_AU/formats.py:/home/wger/src/wger/formats/en_AU/formats.py:ro
      - *recovery-model
      - *recovery-exports
      - *recovery-api
      - *recovery-tasks
      - *recovery-log
      - *recovery-cardio-migration
      - *recovery-migration
volumes:
  database: {}
  redis: {}
  static: {}
  media: {}
  beat: {}
networks:
  default: {name: fitness_wger_private}
